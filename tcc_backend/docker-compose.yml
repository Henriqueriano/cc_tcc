services:
  qlever-backend:
    image: adfreiburg/qlever:commit-7bd9779 # freeze version.
    container_name: qlever-backend
    restart: unless-stopped
    ports:
      - "7001:7001"
    volumes:
      - ./Qlever_data:/index
    environment:
      - INDEX_PREFIX=olympics
    command: ServerMain -p 7001 -i /index/vldb-easy

  qlever-ui:
    image: qleverdev/qlever-ui:latest
    container_name: qlever-ui
    restart: unless-stopped
    ports:
      - "7002:7002"
    environment:
      - QLEVER_BACKEND_URL=http://qlever-backend:7001
    depends_on:
      - qlever-backend

  postgres:
    image: postgres:17
    container_name: postgres_instance
    restart: always
    environment:
      POSTGRES_USER: application_manager
      POSTGRES_PASSWORD: K33NUH5@?3z5
      POSTGRES_DB: tcc
    ports:
      - "5432:5432"
    volumes:
      - ./Postgres_data:/var/lib/postgresql/data
    shm_size: 128mb

    volumes:
      postgres_data:
